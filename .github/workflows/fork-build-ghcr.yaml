name: Fork Build to GHCR

# Builds the frontend and backend images from this fork and pushes them to GHCR
# so a patched service map can be deployed to a test cluster. The image tag
# follows the branch: `combined` builds :combined, leaving :world-labels intact.
# Not for upstream.

on:
  workflow_dispatch: {}
  push:
    branches:
      - world-family-labels
      - combined

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: hubble-ui-backend
          - name: frontend
            context: .
            dockerfile: ./Dockerfile
            image: hubble-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN could not create packages from a fork, so a PAT with
      # write:packages is stored as the GHCR_TOKEN secret.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # Only the arch of the test cluster, to keep build times down.
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name == 'combined' && 'combined' || 'world-labels' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
